<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی FAB با پس‌زمینه متمایز</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* خلفية رمادية فاتحة لإبراز الأزرار البيضاء */
            background: #e0e5ec; 
        }

        .fab-container {
            position: fixed;
            bottom: 50px;
            left: 50px;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
        }

        /* الزر الرئيسي */
        .fab-main {
            width: 70px;
            height: 70px;
            background: #2d3436; /* رمادي غامق جداً */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 28px;
            box-shadow: 6px 6px 12px #b8b9be, -6px -6px 12px #ffffff; /* تأثير بارز */
            cursor: pointer;
            z-index: 100;
            transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .fab-container:hover .fab-main {
            transform: rotate(45deg);
            background: #ff4757; /* أحمر عند الفتح */
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3);
        }

        /* قائمة الأيقونات */
        .fab-list {
            list-style: none;
            display: flex;
            flex-direction: column-reverse;
            gap: 15px;
            margin-bottom: 20px;
            opacity: 0;
            pointer-events: none;
            transition: 0.5s;
            transform: translateY(30px);
        }

        .fab-container:hover .fab-list {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .fab-list li a {
            width: 55px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff; /* أبيض ناصع يظهر الآن بوضوح */
            color: #2d3436;
            border-radius: 50%;
            font-size: 22px;
            text-decoration: none;
            box-shadow: 4px 4px 10px #b8b9be, -4px -4px 10px #ffffff;
            position: relative;
            transition: 0.3s;
            overflow: hidden;
            z-index: 1;
        }

        /* تأثير السائل الملون (Liquid Flow) */
        .fab-list li a::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--clr);
            border-radius: 50%;
            transform: scale(0);
            transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: -1;
        }

        .fab-list li a:hover::before {
            transform: scale(1);
        }

        .fab-list li a:hover {
            color: #fff;
            transform: scale(1.1);
            box-shadow: 0 8px 15px var(--glow);
        }

        /* تعريف الألوان والتوهج */
        .fb { --clr: #1877F2; --glow: rgba(24, 119, 242, 0.4); }
        .x { --clr: #000000; --glow: rgba(0, 0, 0, 0.2); }
        .inst { --clr: #E4405F; --glow: rgba(228, 64, 95, 0.4); }
        .yt { --clr: #ff0000; --glow: rgba(255, 0, 0, 0.4); }

    </style>
</head>
<body>

    <div class="fab-container">
        <div class="fab-main">
            <i class="fas fa-plus"></i>
        </div>

        <ul class="fab-list">
            <li><a href="#" class="yt"><i class="fab fa-youtube"></i></a></li>
            <li><a href="#" class="inst"><i class="fab fa-instagram"></i></a></li>
            <li><a href="#" class="x"><i class="fa-brands fa-x-twitter"></i></a></li>
            <li><a href="#" class="fb"><i class="fab fa-facebook-f"></i></a></li>
        </ul>
    </div>

</body>
</html>
