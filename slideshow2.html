<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معرض بطاقات نقي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* حاوية الكروت الذكية */
        .stack-container {
            position: relative;
            width: 85vw;
            height: 70vh;
            perspective: 1200px;
            z-index: 1;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 30px;
            background-size: cover;
            background-position: center;
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* ترتيب الطبقات */
        .card:nth-child(1) { z-index: 3; transform: translateZ(0) scale(1); opacity: 1; }
        .card:nth-child(2) { z-index: 2; transform: translateY(-25px) translateZ(-40px) scale(0.94); opacity: 0.7; }
        .card:nth-child(3) { z-index: 1; transform: translateY(-50px) translateZ(-80px) scale(0.88); opacity: 0.4; }
        .card:nth-child(n+4) { opacity: 0; transform: translateY(-70px) translateZ(-120px); }

        .card.exit {
            transform: translateY(-120%) rotate(10deg) !important;
            opacity: 0;
        }

        /* المنيو الدائري الملون */
        .circular-menu {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 60px;
            height: 60px;
            z-index: 100;
        }

        .menu-items {
            list-style: none;
            position: absolute;
            width: 100%; height: 100%;
            transition: 0.5s;
        }

        .menu-items a {
            position: absolute;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff4757; /* اللون الموحد للأيقونات */
            text-decoration: none;
            font-size: 18px;
            opacity: 0;
            transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform: scale(0);
        }

        .circular-menu.active .menu-items a { opacity: 1; transform: scale(1); }

        /* توزيع الأيقونات دورانيًا */
        .circular-menu.active .menu-items a:nth-child(1) { top: -80px; right: 0; }
        .circular-menu.active .menu-items a:nth-child(2) { top: -70px; right: 60px; }
        .circular-menu.active .menu-items a:nth-child(3) { top: -30px; right: 85px; }
        .circular-menu.active .menu-items a:nth-child(4) { top: 30px; right: 85px; }

        .menu-trigger {
            width: 65px;
            height: 65px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: 0.4s;
            position: relative;
            z-index: 101;
            border: none;
        }

        .circular-menu.active .menu-trigger {
            transform: rotate(45deg);
            background: #ff4757; /* لون متناسق مع الأيقونات */
            color: white;
        }

        /* أزرار التنقل */
        .nav-btns {
            position: fixed;
            bottom: 45px;
            left: 30px;
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        .nav-btns button {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            width: 50px; height: 50px;
            border-radius: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="stack-container" id="stack"></div>

    <div class="nav-btns">
        <button onclick="prevCard()"><i class="fas fa-undo"></i></button>
        <button onclick="nextCard()"><i class="fas fa-arrow-up"></i></button>
    </div>

    <div class="circular-menu" id="circMenu">
        <div class="menu-items">
            <a href="#"><i class="fab fa-discord"></i></a>
            <a href="#"><i class="fab fa-snapchat"></i></a>
            <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
        </div>
        <button class="menu-trigger" onclick="toggleMenu()">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <script>
        const stack = document.getElementById('stack');
        
        // قائمة الصور (يمكنك تغييرها بسهولة)
        const myImages = [
            "https://picsum.photos/id/260/1080/1920",
            "https://picsum.photos/id/261/1080/1920",
            "https://picsum.photos/id/262/1080/1920",
            "https://picsum.photos/id/263/1080/1920",
            "https://picsum.photos/id/264/1080/1920"
        ];

        function createStack() {
            myImages.forEach((url) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.backgroundImage = `url('${url}')`;
                stack.appendChild(card);
            });
        }

        function nextCard() {
            const cards = document.querySelectorAll('.card');
            if (cards.length === 0) return;
            const first = cards[0];
            first.classList.add('exit');
            setTimeout(() => {
                first.classList.remove('exit');
                stack.appendChild(first);
            }, 600);
        }

        function prevCard() {
            const cards = document.querySelectorAll('.card');
            stack.prepend(cards[cards.length - 1]);
        }

        function toggleMenu() {
            document.getElementById('circMenu').classList.toggle('active');
        }

        // Swipe Up/Down
        let startY = 0;
        document.addEventListener('touchstart', e => startY = e.touches[0].clientY);
        document.addEventListener('touchend', e => {
            let endY = e.changedTouches[0].clientY;
            if (startY - endY > 50) nextCard();
            if (endY - startY > 50) prevCard();
        });

        createStack();
    </script>
</body>
</html>
